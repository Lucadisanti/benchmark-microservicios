services:
  api-1:
    image: benchmark-api
    container_name: api-1
    environment:
      - INSTANCE_NAME=api-1
    ports:
      - "5001:5000"

  api-2:
    image: benchmark-api
    container_name: api-2
    environment:
      - INSTANCE_NAME=api-2
    ports:
      - "5002:5000"

  api-3:
    image: benchmark-api
    container_name: api-3
    environment:
      - INSTANCE_NAME=api-3
    ports:
      - "5003:5000"

  api-4:
    image: benchmark-api
    container_name: api-4
    environment:
      - INSTANCE_NAME=api-4
    ports:
      - "5004:5000"

  nginx:
    image: nginx:latest
    container_name: nginx-benchmark
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
      - api-3
      - api-4