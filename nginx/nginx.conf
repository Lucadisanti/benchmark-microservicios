events {}

http {
    upstream benchmark_api {
        server api-1:5000;
        server api-2:5000;
        server api-3:5000;
        server api-4:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://benchmark_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}